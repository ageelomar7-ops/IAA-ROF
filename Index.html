<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقعي التفاعلي</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; }
        .container { background: white; padding: 20px; border-radius: 10px; width: 80%; max-width: 400px; margin: auto; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        input { padding: 10px; width: 70%; font-size: 16px; border: 1px solid #ccc; border-radius: 5px; margin-bottom: 10px; }
        button { padding: 10px 20px; font-size: 16px; background-color: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #218838; }
        ul { list-style: none; padding: 0; margin-top: 20px; text-align: right; }
        li { background: #e9ecef; padding: 10px; margin-bottom: 8px; border-radius: 5px; word-break: break-word; }
    </style>
</head>
<body>

    <div class="container">
        <h2>اكتب أي شيء وسيتم حفظه للجميع:</h2>
        <input type="text" id="userInput" placeholder="اكتب هنا...">
        <br>
        <button onclick="saveData()">حفظ</button>

        <h3>المحتوى المحفوظ:</h3>
        <ul id="dataList"></ul>
    </div>

    <!-- مكتبات Firebase V8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
      // المفاتيح الخاصة بمشروعك IAA Project
      const firebaseConfig = {
        apiKey: "AIzaSyCvbkZR-n08oDnM5ARJI1hXd0KEIdrytic...", // المأخوذة من الشاشة عندك
        authDomain: "iaa-project-53cc9.firebaseapp.com",
        databaseURL: "https://iaa-project-53cc9-default-rtdb.firebaseio.com",
        projectId: "iaa-project-53cc9",
        storageBucket: "iaa-project-53cc9.firebasestorage.app",
        messagingSenderId: "1024541568105",
        appId: "1:1024541568105:web:f98d8d25cb0f17890666f8",
        measurementId: "G-GJS51070NY"
      };

      // تهيئة الفايربيس وقاعدة البيانات
      firebase.initializeApp(firebaseConfig);
      const database = firebase.database();

      // دالة الحفظ
      function saveData() {
        const input = document.getElementById("userInput");
        const text = input.value.trim();
        if (text !== "") {
          database.ref("appData").push({ text: text, timestamp: Date.now() });
          input.value = "";
        }
      }

      // دالة الاستماع والتحديث التلقائي لكل الزوار
      database.ref("appData").on("value", (snapshot) => {
        const list = document.getElementById("dataList");
        list.innerHTML = "";
        snapshot.forEach((child) => {
          const li = document.createElement("li");
          li.textContent = child.val().text;
          list.appendChild(li);
        });
      });
    </script>
</body>
</html>
